server:
  port: 8080

spring:
  application:
    name: medisaas-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/medisaas_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      "[hibernate.format_sql]": true
      "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: localhost
    port: 5672

logging:
  level:
    "[org.springframework.web]": INFO
    "[com.medisaas]": DEBUG
